# nginx config INSIDE the web container.
# Serves the built SPA and proxies /api to the `goldshop-api` service (compose DNS).
# TLS and the public subdomain are handled by Apache/Webuzo on the host —
# see deploy/apache/subdomain-vhost.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router / deep links: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API passthrough. proxy_pass has NO trailing slash, so the /api prefix is
    # preserved (the server mounts routes at /api/...).
    location /api/ {
        proxy_pass http://goldshop-api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
