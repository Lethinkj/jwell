# Apache reverse-proxy config — public entry for the demo on the Webuzo server.
#
# >>> Subdomain: demo.marvelslice.com — change this everywhere if you rename it. <<<
#
# 80/443 are already served by Apache (Webuzo), which terminates TLS. Apache
# forwards to the web container published on 127.0.0.1:8083.
#
#   Internet -> Apache (HTTPS) -> 127.0.0.1:8083 -> goldshop-web -> goldshop-api
#
# Required modules (Webuzo ships them; enable if missing):
#   rewrite, proxy, proxy_http, headers, ssl

# =============================================================================
# (A) .htaccess in the subdomain's DocumentRoot   <-- USED FOR THIS DEPLOYMENT
# =============================================================================
# Matches the existing lms.marvelslice.com site on the same box. Copy
# deploy/apache/subdomain.htaccess into the subdomain's DocumentRoot, rename it
# to `.htaccess`, then hit the URL:
#
#   RewriteEngine On
#   RequestHeader set Host "demo.marvelslice.com"
#   RewriteCond %{REQUEST_URI} !^/\.well-known [NC]
#   RewriteRule ^(.*)$ http://127.0.0.1:8083/$1 [P,L]
#
# Notes:
# - [P] proxies via mod_proxy. Do NOT use [R] — that redirects the browser to
#   127.0.0.1:8083, i.e. the visitor's own machine.
# - ProxyPass cannot be used in .htaccess (server/vhost context only); using it
#   there just yields a 404/500. Use the RewriteRule [P] form above.
# - Keep the !^/\.well-known condition so Let's Encrypt renewals keep working.
# - Needs AllowOverride to permit FileInfo. If lms works, it already does.

# =============================================================================
# (B) VirtualHost ProxyPass — alternative if you'd rather edit the vhost
# =============================================================================
# Put this inside the subdomain's <VirtualHost *:80> AND <VirtualHost *:443>:
#
#   ProxyPreserveHost On
#   ProxyRequests Off
#   RequestHeader set X-Forwarded-Proto "https"
#   ProxyPass        / http://127.0.0.1:8083/ connectiontimeout=5 timeout=120
#   ProxyPassReverse / http://127.0.0.1:8083/
#
# Setup either way: Webuzo -> Domains -> add subdomain `demo.marvelslice.com`
# (+ DNS A record to the VPS) and enable SSL (Let's Encrypt). Webuzo writes the
# SSLCertificate* lines and the :80 -> :443 redirect — don't hand-write them.
