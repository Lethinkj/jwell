# Apache vhost — public entry for the demo on the Webuzo server.
#
# >>> Subdomain: demo.marvelslice.com — change this everywhere if you rename it. <<<
#
# Your 80/443 are already served by Apache (Webuzo), which terminates TLS. Apache
# reverse-proxies to the web container published on 127.0.0.1:8083.
#
#   Internet -> Apache (this vhost, HTTPS) -> 127.0.0.1:8083 -> goldshop-web -> goldshop-api
#
# HOW TO APPLY (Webuzo):
#   1. Panel -> Domains -> add subdomain `demo.marvelslice.com` (+ DNS A record to the VPS).
#   2. Panel -> enable SSL for it (Webuzo's Let's Encrypt). This writes the
#      `SSLCertificate*` lines and the :80 -> :443 redirect FOR you.
#   3. Add ONLY the proxy lines below to that subdomain's Apache config
#      (Webuzo: Domain -> "Custom Apache Configuration" / vhost extra directives),
#      then reload Apache. Don't hand-write the SSL paths — let Webuzo own them.
#
# Required Apache modules (Webuzo ships them; enable if missing):
#   proxy, proxy_http, headers, rewrite, ssl

# ---- Minimal lines to paste into the subdomain's existing vhost (recommended) ----
ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Proto "https"

ProxyPass        / http://127.0.0.1:8083/ connectiontimeout=5 timeout=120
ProxyPassReverse / http://127.0.0.1:8083/


# ---- For reference only: what Webuzo's generated vhost roughly looks like --------
# <VirtualHost *:80>
#     ServerName demo.marvelslice.com
#     RewriteEngine On
#     RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
# </VirtualHost>
#
# <VirtualHost *:443>
#     ServerName demo.marvelslice.com
#     # SSLEngine / SSLCertificateFile / SSLCertificateKeyFile  <- managed by Webuzo
#
#     ProxyPreserveHost On
#     ProxyRequests Off
#     RequestHeader set X-Forwarded-Proto "https"
#     ProxyPass        / http://127.0.0.1:8083/ connectiontimeout=5 timeout=120
#     ProxyPassReverse / http://127.0.0.1:8083/
# </VirtualHost>
